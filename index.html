<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>Schiffy Runner</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd3f0; touch-action: none; user-select: none;
      -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
    #view { position: absolute; inset: 0; }
    .ui { font-family: "Trebuchet MS", "Segoe UI", system-ui, sans-serif; font-weight: 800; color: #fff;
      text-shadow: 0 3px 0 #2d4a6b, 0 0 8px #2d4a6b88; }
    #score { position: absolute; top: 14px; right: 20px; font-size: 30px; letter-spacing: 2px; white-space: pre;
      font-variant-numeric: tabular-nums; }
    #score .hi { opacity: .7; margin-right: 18px; font-size: .8em; }
    #score.blink .cur { visibility: hidden; }
    #card { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      pointer-events: none; text-align: center; }
    #card .box { background: #2d4a6bcc; border: 4px solid #fff; border-radius: 26px; padding: 20px 40px 22px; }
    #card .t { font-size: 58px; line-height: 1; }
    #card .s { font-size: 22px; margin-top: 12px; }
    #card .k { font-size: 16px; margin-top: 10px; opacity: .85; font-weight: 600; }
    #card.hide { display: none; }
    /* credits: a small button on the start / game-over screens only, opens a panel */
    #creditsBtn { position: absolute; left: 14px; top: 14px; width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid #fff; background: #2d4a6bcc; color: #fff; font: 800 18px "Trebuchet MS", system-ui, sans-serif;
      cursor: pointer; padding: 0; }
    #card.hide ~ #creditsBtn { display: none; }
    #credits { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
      background: #0006; text-align: center; }
    #credits .box { background: #2d4a6bee; border: 4px solid #fff; border-radius: 22px; padding: 18px 28px; max-width: 80vw; }
    #credits .t { font-size: 26px; margin-bottom: 10px; }
    #credits p { margin: 6px 0; font: 600 14px system-ui, sans-serif; text-shadow: none; }
    #credits .k { margin-top: 12px; font-size: 13px; opacity: .8; }
    #credits.hide { display: none; }
    @media (max-width: 600px) { #card .t { font-size: 38px; } #card .box { padding: 16px 22px; } #score { font-size: 22px; } }
  </style>
  <script type="importmap">
    { "imports": { "three": "./vendor/three/build/three.module.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="view"></div>
  <div id="score" class="ui"></div>
  <div id="card" class="ui"><div class="box"><div class="t">SCHIFFY RUNNER</div><div class="s">LOADING...</div><div class="k"></div></div></div>
  <button id="creditsBtn" aria-label="Credits">i</button>
  <!-- the crow model is CC-BY: this credit must stay reachable while it's used -->
  <div id="credits" class="ui hide"><div class="box"><div class="t">CREDITS</div>
    <p>Crow model: "Bird" by Poly by Google (CC-BY)</p>
    <p>Trees, rocks, props: KayKit by Kay Lousberg, Tiny Treats by Isa Lousberg (CC0)</p>
    <p>Schiffy and the Moku world by Moku</p>
    <div class="k">Tap or press any key to close</div></div></div>
  <script type="module" src="./main.js"></script>
</body>
</html>
